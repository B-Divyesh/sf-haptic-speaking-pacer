name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build web app
        run: npm ci && npm test && npm run build
      - name: Sync Capacitor project
        run: npx cap sync ios
      - name: Archive unsigned app
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$RUNNER_TEMP/App-unsigned.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/unsigned/Payload/"
          cd "$RUNNER_TEMP/unsigned"
          zip -qry "$GITHUB_WORKSPACE/haptic-speaking-pacer-unsigned.ipa" Payload
      - name: Validate unsigned package
        run: |
          set -euo pipefail
          test "$(stat -f%z haptic-speaking-pacer-unsigned.ipa)" -gt 1000000
          unzip -p haptic-speaking-pacer-unsigned.ipa Payload/App.app/Info.plist > "$RUNNER_TEMP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Info.plist")" = "in.sociobot.haptic_speaking_pacer"
          shasum -a 256 haptic-speaking-pacer-unsigned.ipa > SHA256SUMS
      - name: Import Apple signing credentials
        if: ${{ secrets.APPLE_TEAM_ID != '' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/pace-trail.mobileprovision"
      - name: Build signed IPA when operator secrets exist
        if: ${{ secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App-signed.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          sed -e "s/TEAM_ID/$APPLE_TEAM_ID/g" -e "s/PROFILE_NAME/$PROFILE_NAME/g" .github/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App-signed.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/export/App.ipa" haptic-speaking-pacer-signed.ipa
          shasum -a 256 haptic-speaking-pacer-signed.ipa >> SHA256SUMS
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haptic-speaking-pacer-ios
          path: |
            haptic-speaking-pacer-unsigned.ipa
            haptic-speaking-pacer-signed.ipa
            SHA256SUMS
          if-no-files-found: ignore
      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          name: Pace Trail v0.1.0
          generate_release_notes: true
          files: |
            haptic-speaking-pacer-unsigned.ipa
            haptic-speaking-pacer-signed.ipa
            SHA256SUMS
          fail_on_unmatched_files: false
